<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Walle08 - Nature Side Scroller</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #87ceeb;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      z-index: 10;
    }
    #ui-overlay h1 {
      margin: 0;
      font-size: 16px;
      color: #ffffff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    /* CONTROLLI SCORRIMENTO LATERALE */
    #dpad-side {
      position: absolute;
      bottom: 30px;
      left: 20px;
      display: flex;
      gap: 15px;
      z-index: 20;
    }
    .btn-touch {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      color: white;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
    }
    .btn-touch:active, .btn-touch.active {
      background: rgba(46, 204, 113, 0.8);
      border-color: #2ecc71;
      transform: scale(0.95);
    }

    #btn-jump {
      position: absolute;
      bottom: 30px;
      right: 25px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(231, 76, 60, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      touch-action: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
    }
    #btn-jump:active, #btn-jump.active {
      background: rgba(231, 76, 60, 1);
      transform: scale(0.95);
    }
  </style>

  <!-- LIBRERIE TRADIZIONALI PER LA MASSIMA COMPATIBILITÀ MOBILE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <h1>Walle08 - Nature Adventure</h1>
  </div>

  <!-- Pulsanti di movimento laterale (Sinistra / Destra) -->
  <div id="dpad-side">
    <div class="btn-touch" id="btn-left">◀</div>
    <div class="btn-touch" id="btn-right">▶</div>
  </div>

  <!-- Pulsante Salto -->
  <div id="btn-jump">SALTO</div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, player;

    const touchState = {
      left: false,
      right: false,
      jump: false
    };

    // Parametri di movimento e fisica
    const moveSpeed = 0.12;
    let velocityY = 0;
    const gravity = -0.015;
    const jumpStrength = 0.35;
    let isGrounded = true;
    const groundY = 0;

    window.onload = () => {
      init();
      animate();
    };

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scena & Ambiente Naturale
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb); // Cielo Azzurro
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

      // 2. Telecamera ravvicinata di profilo
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 6); // Distanza ridotta a 6 per essere molto più vicini a walle08

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 4. Luci Naturali
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xfffaed, 1.6);
      sunLight.position.set(10, 20, 10);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      scene.add(sunLight);

      // 5. Scenario Naturale (Erba, Alberi, Cespugli)
      createNatureEnvironment();

      // 6. Personaggio temporaneo di partenza
      createFallbackPlayer();

      // 7. Caricamento del modello walle08.glb
      if (typeof THREE.GLTFLoader !== 'undefined') {
        const loader = new THREE.GLTFLoader();
        loader.load(
          './walle08.glb',
          (gltf) => {
            if (player) scene.remove(player);

            player = gltf.scene;

            const box = new THREE.Box3().setFromObject(player);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2 / (maxDim || 1);
            player.scale.setScalar(scale);

            box.setFromObject(player);
            const center = box.getCenter(new THREE.Vector3());
            player.position.sub(center);
            player.position.y = groundY;

            player.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
              }
            });

            scene.add(player);
          },
          undefined,
          (err) => console.warn("File walle08.glb non trovato, in uso il segnaposto.", err)
        );
      }

      setupTouchControls();
      window.addEventListener('resize', onWindowResize);
    }

    function createFallbackPlayer() {
      const geo = new THREE.BoxGeometry(0.8, 1.2, 0.8);
      const mat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
      player = new THREE.Mesh(geo, mat);
      player.position.set(0, 0.6, 0);
      player.castShadow = true;
      scene.add(player);
    }

    function createNatureEnvironment() {
      // Terreno Erbosco
      const groundGeo = new THREE.BoxGeometry(300, 2, 10);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x47a042 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.position.set(0, -1, 0);
      ground.receiveShadow = true;
      scene.add(ground);

      // Generazione Alberi e Cespugli lungo il percorso
      const treeMatTrunk = new THREE.MeshLambertMaterial({ color: 0x5a3d28 });
      const treeMatLeaves = new THREE.MeshLambertMaterial({ color: 0x2d7d32 });
      const bushMat = new THREE.MeshLambertMaterial({ color: 0x388e3c });

      for (let x = -100; x <= 100; x += 6) {
        // Genera alberi nello sfondo (Z < 0) e alcuni in primo piano (Z > 0)
        if (Math.random() > 0.3) {
          const zPos = (Math.random() - 0.5) * 6 - 2; // Sfondo o primo piano
          const scale = 0.8 + Math.random() * 0.6;

          // Tronco
          const trunkGeo = new THREE.CylinderGeometry(0.2 * scale, 0.3 * scale, 2.5 * scale, 8);
          const trunk = new THREE.Mesh(trunkGeo, treeMatTrunk);
          trunk.position.set(x + (Math.random() - 0.5) * 3, (2.5 * scale) / 2, zPos);
          trunk.castShadow = true;
          scene.add(trunk);

          // Chioma dell'albero (Cono)
          const leavesGeo = new THREE.ConeGeometry(1.5 * scale, 3.5 * scale, 8);
          const leaves = new THREE.Mesh(leavesGeo, treeMatLeaves);
          leaves.position.set(trunk.position.x, trunk.position.y + (1.5 * scale), zPos);
          leaves.castShadow = true;
          scene.add(leaves);
        }

        // Genera Cespugli
        if (Math.random() > 0.4) {
          const zPos = (Math.random() - 0.5) * 4 - 1;
          const bushGeo = new THREE.SphereGeometry(0.5 + Math.random() * 0.4, 8, 8);
          const bush = new THREE.Mesh(bushGeo, bushMat);
          bush.position.set(x + (Math.random() - 0.5) * 4, 0.3, zPos);
          bush.castShadow = true;
          scene.add(bush);
        }
      }
    }

    function setupTouchControls() {
      const bindBtn = (id, key) => {
        const btn = document.getElementById(id);
        
        const start = (e) => {
          if (e.cancelable) e.preventDefault();
          touchState[key] = true;
          btn.classList.add('active');
        };

        const end = (e) => {
          if (e.cancelable) e.preventDefault();
          touchState[key] = false;
          btn.classList.remove('active');
        };

        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };

      bindBtn('btn-left', 'left');
      bindBtn('btn-right', 'right');
      bindBtn('btn-jump', 'jump');
    }

    function updatePlayerMovement() {
      if (!player) return;

      // Movimento orizzontale lungo l'asse X
      if (touchState.left) {
        player.position.x -= moveSpeed;
        player.rotation.y = -Math.PI / 2; // Ruota a sinistra
      }
      if (touchState.right) {
        player.position.x += moveSpeed;
        player.rotation.y = Math.PI / 2; // Ruota a destra
      }

      // Gestione Salto e Gravità
      if (touchState.jump && isGrounded) {
        velocityY = jumpStrength;
        isGrounded = false;
      }

      player.position.y += velocityY;
      velocityY += gravity;

      // Collisione con il terreno
      if (player.position.y <= groundY) {
        player.position.y = groundY;
        velocityY = 0;
        isGrounded = true;
      }

      // La telecamera segue da vicino il personaggio sull'asse X ed Y
      camera.position.x = player.position.x;
      camera.lookAt(player.position.x, player.position.y + 0.8, 0);
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
