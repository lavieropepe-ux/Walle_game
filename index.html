<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Walle08 - Mobile Controls</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a24;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      z-index: 10;
    }
    #ui-overlay h1 {
      margin: 0;
      font-size: 16px;
      color: #00d2ff;
    }

    /* CONTROLLI TOUCH */
    #dpad {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 140px;
      height: 140px;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 5px;
    }
    .btn-touch {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: white;
      touch-action: none;
    }
    .btn-touch:active, .btn-touch.active {
      background: rgba(0, 210, 255, 0.7);
      border-color: #00d2ff;
    }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
    #btn-right { grid-column: 3; grid-row: 2; }

    #btn-jump {
      position: absolute;
      bottom: 35px;
      right: 25px;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: rgba(231, 76, 60, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: white;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      touch-action: none;
    }
    #btn-jump:active, #btn-jump.active {
      background: rgba(231, 76, 60, 1);
      transform: scale(0.95);
    }
  </style>

  <!-- LIBRERIE TRADIZIONALI SENZA IMPORTMAP (COMPATIBILI 100% MOBILE) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <h1>walle08 - Mobile Viewer</h1>
  </div>

  <div id="dpad">
    <div class="btn-touch" id="btn-up">▲</div>
    <div class="btn-touch" id="btn-left">◀</div>
    <div class="btn-touch" id="btn-down">▼</div>
    <div class="btn-touch" id="btn-right">▶</div>
  </div>

  <div id="btn-jump">SALTO</div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls, player;

    const touchState = {
      up: false,
      down: false,
      left: false,
      right: false,
      jump: false
    };

    const moveSpeed = 0.12;
    let velocityY = 0;
    const gravity = -0.015;
    const jumpStrength = 0.35;
    let isGrounded = true;
    const groundY = 0;

    window.onload = () => {
      init();
      animate();
    };

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scena
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a24);

      // 2. Telecamera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 8);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // 4. OrbitControls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;

      // 5. Illuminazione
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
      mainLight.position.set(10, 20, 15);
      mainLight.castShadow = true;
      scene.add(mainLight);

      // 6. Terreno / Griglia
      const grid = new THREE.GridHelper(50, 50, 0x00d2ff, 0x444444);
      scene.add(grid);

      // 7. Personaggio di partenza visibile SUBITO
      createFallbackPlayer();

      // 8. Caricamento del file walle08.glb
      if (typeof THREE.GLTFLoader !== 'undefined') {
        const loader = new THREE.GLTFLoader();
        loader.load(
          './walle08.glb',
          (gltf) => {
            if (player) scene.remove(player);

            player = gltf.scene;

            const box = new THREE.Box3().setFromObject(player);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2 / (maxDim || 1);
            player.scale.setScalar(scale);

            box.setFromObject(player);
            const center = box.getCenter(new THREE.Vector3());
            player.position.sub(center);
            player.position.y = groundY;

            player.traverse((child) => {
              if (child.isMesh) child.castShadow = true;
            });

            scene.add(player);
          },
          undefined,
          (err) => console.warn("Errore caricamento walle08.glb:", err)
        );
      }

      setupTouchControls();
      window.addEventListener('resize', onWindowResize);
    }

    function createFallbackPlayer() {
      const geo = new THREE.BoxGeometry(1, 1.5, 1);
      const mat = new THREE.MeshLambertMaterial({ color: 0x00d2ff });
      player = new THREE.Mesh(geo, mat);
      player.position.set(0, 0.75, 0);
      player.castShadow = true;
      scene.add(player);
    }

    function setupTouchControls() {
      const bindBtn = (id, key) => {
        const btn = document.getElementById(id);
        
        const start = (e) => {
          if (e.cancelable) e.preventDefault();
          touchState[key] = true;
          btn.classList.add('active');
        };

        const end = (e) => {
          if (e.cancelable) e.preventDefault();
          touchState[key] = false;
          btn.classList.remove('active');
        };

        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };

      bindBtn('btn-up', 'up');
      bindBtn('btn-down', 'down');
      bindBtn('btn-left', 'left');
      bindBtn('btn-right', 'right');
      bindBtn('btn-jump', 'jump');
    }

    function updatePlayerMovement() {
      if (!player) return;

      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();

      const side = new THREE.Vector3();
      side.crossVectors(camera.up, forward).negate();

      const moveDir = new THREE.Vector3(0, 0, 0);

      if (touchState.up) moveDir.add(forward);
      if (touchState.down) moveDir.sub(forward);
      if (touchState.left) moveDir.sub(side);
      if (touchState.right) moveDir.add(side);

      if (moveDir.lengthSq() > 0) {
        moveDir.normalize();
        player.position.addScaledVector(moveDir, moveSpeed);

        const targetAngle = Math.atan2(moveDir.x, moveDir.z);
        player.rotation.y = targetAngle;
      }

      if (touchState.jump && isGrounded) {
        velocityY = jumpStrength;
        isGrounded = false;
      }

      player.position.y += velocityY;
      velocityY += gravity;

      if (player.position.y <= groundY) {
        player.position.y = groundY;
        velocityY = 0;
        isGrounded = true;
      }

      controls.target.copy(player.position).add(new THREE.Vector3(0, 1, 0));
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();
      controls.update();
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
