<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Walle08 - Halloween Nightmare Platformer</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0814;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(20, 10, 30, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 140, 0, 0.4);
      pointer-events: none;
      z-index: 10;
      font-size: 18px;
      font-weight: bold;
      color: #ff9d00;
      box-shadow: 0 0 15px rgba(255, 120, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    #btn-reset-lvl1 {
      pointer-events: auto;
      background: rgba(255, 69, 0, 0.3);
      border: 1px solid #ff4500;
      color: #fff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #btn-reset-lvl1:hover {
      background: rgba(255, 69, 0, 0.7);
    }

    #level-transition-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 5, 20, 0.92);
      border: 2px solid #ff9d00;
      padding: 20px 40px;
      border-radius: 16px;
      text-align: center;
      z-index: 25;
      box-shadow: 0 0 25px rgba(255, 140, 0, 0.6);
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    #level-transition-banner.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #level-transition-banner h2 {
      margin: 0;
      font-size: 32px;
      color: #ffaa00;
      text-shadow: 0 0 10px #ff4500;
    }
    .checkpoint-tag {
      font-size: 14px;
      color: #00e5ff;
      margin-top: 8px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #game-over-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 5, 15, 0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: white; z-index: 30;
    }
    #game-over-overlay.hidden { display: none; }
    #game-over-overlay h1 { font-size: 42px; margin-bottom: 10px; text-shadow: 0 0 10px #ff4500; text-align: center; }
    #game-over-overlay p { font-size: 18px; margin-bottom: 20px; color: #dcdcdc; text-align: center; max-width: 80%; }
    
    .btn-group {
      display: flex;
      gap: 15px;
    }
    .game-btn {
      padding: 12px 24px; font-size: 16px; font-weight: bold; color: #fff;
      border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.1s, background 0.2s;
    }
    .game-btn:active { transform: scale(0.96); }
    #restart-btn { background: #d35400; }
    #restart-btn:hover { background: #e67e22; }
    #restart-lvl1-btn { background: #4a235a; border: 1px solid #8e44ad; }
    #restart-lvl1-btn:hover { background: #5b2c6f; }

    /* JOYSTICK ANALOGICO MOVIMENTO (SINISTRA) */
    #joystick-container {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 110px;
      height: 110px;
      background: rgba(40, 20, 60, 0.4);
      border: 2px solid rgba(255, 140, 0, 0.6);
      border-radius: 50%;
      z-index: 20;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }
    #joystick-knob {
      width: 50px;
      height: 50px;
      background: rgba(255, 140, 0, 0.85);
      border: 2px solid #ffaa00;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 140, 0, 0.6);
      transition: transform 0.05s ease-out;
      pointer-events: none;
    }

    /* JOYSTICK ANALOGICO CAMPO VISIVO (DESTRA - LIVELLO 4) */
    #camera-joystick-container {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 110px;
      height: 110px;
      background: rgba(20, 40, 60, 0.4);
      border: 2px solid rgba(0, 229, 255, 0.6);
      border-radius: 50%;
      z-index: 20;
      touch-action: none;
      display: none;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
    }
    #camera-joystick-knob {
      width: 50px;
      height: 50px;
      background: rgba(0, 229, 255, 0.85);
      border: 2px solid #80d8ff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
      transition: transform 0.05s ease-out;
      pointer-events: none;
    }

    /* PULSANTE SALTO (LIVELLI 1, 2) */
    #btn-jump {
      position: absolute;
      bottom: 30px;
      right: 25px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(142, 68, 173, 0.85);
      border: 2px solid rgba(255, 140, 0, 0.7);
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      touch-action: none;
      box-shadow: 0 4px 15px rgba(142, 68, 173, 0.6);
      backdrop-filter: blur(4px);
    }
    #btn-jump:active, #btn-jump.active {
      background: rgba(155, 89, 182, 1);
      transform: scale(0.95);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <div>🏷️ <span id="level-display">Livello 1</span></div>
    <div>⏱️ Tempo: <span id="timer">40</span>s</div>
    <button id="btn-reset-lvl1" onclick="restartFromLvl1()" title="Ricomincia dal Livello 1">↺ Lvl 1</button>
  </div>

  <div id="level-transition-banner" class="hidden">
    <h2 id="banner-title">LIVELLO 2</h2>
    <p id="banner-sub" style="margin: 5px 0 0 0; color: #e0e0e0;">Attento ai Pipistrelli Volanti!</p>
    <div class="checkpoint-tag">💾 Checkpoint Salvato</div>
  </div>

  <div id="game-over-overlay" class="hidden">
    <h1 id="status-title">GAME OVER</h1>
    <p id="status-desc">Sei caduto nel vuoto!</p>
    <div class="btn-group">
      <button id="restart-btn" class="game-btn" onclick="resetGame()">Ricomincia da Checkpoint</button>
      <button id="restart-lvl1-btn" class="game-btn" onclick="restartFromLvl1()">Ricomincia da Lvl 1</button>
    </div>
  </div>

  <div id="joystick-container">
    <div id="joystick-knob"></div>
  </div>

  <div id="camera-joystick-container">
    <div id="camera-joystick-knob"></div>
  </div>

  <div id="btn-jump">SALTO</div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, player, playerWalle, playerEvee, finishRing;
    let currentLevel = 1;
    let checkpointLevel = 1;
    let isGameOver = false;
    let isLevel3Starting = false;

    let timeLeft = 40;
    let timerInterval;

    let analogX = 0;
    let analogY = 0;
    let camAnalogX = 0;
    let camAnalogY = 0;
    let isJumpPressed = false;

    let cameraYaw = 0;
    let cameraPitch = 0.3;

    const moveSpeed = 0.16;
    let velocityY = 0;
    const gravity = -0.016;
    const jumpStrength = 0.38;
    let isGrounded = true;

    const groundY = 0.0;
    const foregroundZ = 2.0;

    const playerHalfWidth = 0.5;
    const playerHeight = 1.6;
    const playerHalfHeight = playerHeight / 2;

    const platforms = [
      { start: -10, end: 15 },
      { start: 20, end: 40 },
      { start: 47, end: 70 },
      { start: 77, end: 110 }
    ];

    let level4PlatformMesh = null;

    const obstacles = [
      { x: 5, width: 1.5, height: 1.5, meshes: [] },
      { x: 30, width: 1.5, height: 1.5, meshes: [] },
      { x: 58, width: 1.5, height: 1.5, meshes: [] },
      { x: 88, width: 1.5, height: 1.5, meshes: [] }
    ];

    const pumpkins = [
      { minX: 8, maxX: 14, posY: 0.8, speed: 0.08, dir: 1, radius: 0.6, mesh: null },
      { minX: 22, maxX: 28, posY: 0.8, speed: 0.1, dir: 1, radius: 0.6, mesh: null },
      { minX: 33, maxX: 39, posY: 2.1, speed: 0.09, dir: -1, radius: 0.6, mesh: null },
      { minX: 50, maxX: 56, posY: 0.8, speed: 0.11, dir: 1, radius: 0.6, mesh: null },
      { minX: 61, maxX: 68, posY: 1.9, speed: 0.1, dir: -1, radius: 0.6, mesh: null },
      { minX: 80, maxX: 86, posY: 0.8, speed: 0.12, dir: 1, radius: 0.6, mesh: null }
    ];

    const bats = [
      { minX: 7, maxX: 14, baseY: 1.6, speed: 0.09, dir: 1, mesh: null, leftWing: null, rightWing: null, radius: 0.55 },
      { minX: 21, maxX: 29, baseY: 2.2, speed: 0.11, dir: -1, mesh: null, leftWing: null, rightWing: null, radius: 0.55 },
      { minX: 32, maxX: 39, baseY: 1.4, speed: 0.1, dir: 1, mesh: null, leftWing: null, rightWing: null, radius: 0.55 },
      { minX: 49, maxX: 57, baseY: 2.5, speed: 0.12, dir: -1, radius: 0.55 },
      { minX: 60, maxX: 69, baseY: 1.8, speed: 0.11, dir: 1, radius: 0.55 },
      { minX: 79, maxX: 87, baseY: 2.0, speed: 0.13, dir: -1, radius: 0.55 }
    ];

    const industrialObstacles = [
      { x: 15, y: 1.0, width: 1.2, height: 3.5, mesh: null },
      { x: 25, y: 4.5, width: 1.2, height: 3.5, mesh: null },
      { x: 35, y: 2.2, width: 2.0, height: 1.2, mesh: null },
      { x: 45, y: 0.8, width: 1.2, height: 3.2, mesh: null },
      { x: 55, y: 5.0, width: 1.2, height: 3.5, mesh: null },
      { x: 65, y: 2.8, width: 1.8, height: 1.8, mesh: null },
      { x: 75, y: 1.2, width: 1.2, height: 3.8, mesh: null },
      { x: 85, y: 4.8, width: 1.2, height: 3.2, mesh: null }
    ];
    let industrialPipesGroup = null;

    let darkWorldGroup = null;
    let hiddenLights = [];
    let lightsActivatedCount = 0;
    let darkWorldEvee = null;
    let heartMesh = null;
    let level4Completed = false;

    let introGroup = null;
    let introWallX = -2.0;

    const cameraHeight = 3.5;
    const cameraDistance = 14.0;

    let halloweenBgTexture, industrialBgTexture, darkBgTexture;

    window.onload = () => {
      init();
      animate();
    };

    function generateHalloweenSkyTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#05020a'); grad.addColorStop(0.5, '#180a29');
      grad.addColorStop(0.85, '#3a1322'); grad.addColorStop(1, '#5e2105');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
      return new THREE.CanvasTexture(canvas);
    }

    function generateIndustrialSkyTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#02151a'); grad.addColorStop(0.5, '#08282e');
      grad.addColorStop(1, '#2e1c0c');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
      return new THREE.CanvasTexture(canvas);
    }

    function generateDarkSkyTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#060612'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      return new THREE.CanvasTexture(canvas);
    }

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      halloweenBgTexture = generateHalloweenSkyTexture();
      industrialBgTexture = generateIndustrialSkyTexture();
      darkBgTexture = generateDarkSkyTexture();

      scene.background = halloweenBgTexture;
      scene.fog = new THREE.FogExp2(0x1a0a2a, 0.015);

      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, cameraHeight, cameraDistance);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0x8a55a5, 1.2);
      ambientLight.name = "ambientLight";
      scene.add(ambientLight);

      const moonLight = new THREE.DirectionalLight(0xffa500, 1.5);
      moonLight.name = "moonLight";
      moonLight.position.set(10, 20, 15);
      moonLight.castShadow = true;
      scene.add(moonLight);

      createLevel();
      createPumpkins();
      createBats();
      createIndustrialEnvironment();
      createDarkWorldEnvironment();
      createIntroDecorations();
      createFallbackPlayer();

      if (typeof THREE.GLTFLoader !== 'undefined') {
        const loader = new THREE.GLTFLoader();

        // 1. CARICAMENTO OSTACOLO GLB
        loader.load(
          './bott1_02_1024.glb',
          (gltf) => {
            const rawModel = gltf.scene;
            const rawBox = new THREE.Box3().setFromObject(rawModel);
            const rawSize = rawBox.getSize(new THREE.Vector3());
            const rawCenter = rawBox.getCenter(new THREE.Vector3());
            const targetHeight = 1.6;
            const scaleFactor = targetHeight / (rawSize.y || 1);
            const realWidth = rawSize.x * scaleFactor;
            const realHeight = rawSize.y * scaleFactor;

            const centeredWrapper = new THREE.Group();
            rawModel.position.set(-rawCenter.x, -rawBox.min.y, -rawCenter.z);
            centeredWrapper.add(rawModel);
            centeredWrapper.scale.setScalar(scaleFactor);

            obstacles.forEach(obs => {
              const obsInstance = centeredWrapper.clone();
              obsInstance.position.set(obs.x, 0, foregroundZ);
              obsInstance.traverse((child) => {
                if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
              });
              scene.add(obsInstance);
              obs.width = realWidth;
              obs.height = realHeight;
            });
          },
          undefined,
          (err) => console.warn("Errore caricamento bott1_02_1024.glb:", err)
        );

        // 2. PERSONAGGIO WALLE
        loader.load(
          './walle08.glb',
          (gltf) => {
            if (playerWalle) scene.remove(playerWalle);
            const loadedModel = gltf.scene;
            const box = new THREE.Box3().setFromObject(loadedModel);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = playerHeight / (maxDim || 1);
            
            loadedModel.scale.setScalar(scale);
            box.setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            loadedModel.position.sub(center);

            playerWalle = new THREE.Group();
            playerWalle.add(loadedModel);
            playerWalle.position.set(0, groundY + playerHalfHeight, foregroundZ);
            playerWalle.traverse((child) => { if (child.isMesh) child.castShadow = true; });

            scene.add(playerWalle);
            player = playerWalle;
          },
          undefined,
          (err) => console.warn("Modello walle08.glb non trovato, uso il segnaposto.", err)
        );

        // 3. PERSONAGGIO EVEE (Posizionato esattamente alle coordinate X:-4.0; Y:1.5; Z:2.0 nel Livello 1)
        loader.load(
          './evee.glb',
          (gltf) => {
            const loadedModel = gltf.scene;
            const box = new THREE.Box3().setFromObject(loadedModel);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 1.4 / (maxDim || 1);
            
            loadedModel.scale.setScalar(scale);
            box.setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            loadedModel.position.sub(center);

            // Evee per Livello 3
            playerEvee = new THREE.Group();
            playerEvee.add(loadedModel.clone());
            playerEvee.position.set(0, 2.5, foregroundZ);
            playerEvee.traverse((child) => { if (child.isMesh) child.castShadow = true; });
            playerEvee.visible = false;
            scene.add(playerEvee);

            // Evee per Livello 1: Posizionata alle coordinate richieste (X: -4.0, Y: 1.5, Z: 2.0)
            if (introGroup) {
              const introEvee = loadedModel.clone();
              introEvee.scale.setScalar(scale);
              introEvee.position.set(-4.0, 1.5, 2.0);
              introEvee.rotation.y = Math.PI / 4;
              introGroup.add(introEvee);
            }

            // Evee per Livello 4 (Open World)
            darkWorldEvee = new THREE.Group();
            darkWorldEvee.add(loadedModel.clone());
            darkWorldEvee.position.set(22, groundY, foregroundZ);
            darkWorldEvee.visible = false;
            scene.add(darkWorldEvee);
          },
          undefined,
          (err) => {
            console.warn("Modello evee.glb non trovato. Creo segnaposto per Evee.", err);
            createFallbackEvee();
          }
        );

        // 4. ALBERI DI SFONDO
        loader.load(
          './tree.glb',
          (gltf) => {
            const baseTree = gltf.scene;
            const box = new THREE.Box3().setFromObject(baseTree);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const baseScale = 3.5 / (maxDim || 1);

            for (let x = -10; x <= 110; x += 7) {
              const isOverHole = !platforms.some(p => x >= p.start && x <= p.end);
              if (isOverHole) continue;

              if (Math.random() > 0.3) {
                const treeClone = baseTree.clone();
                const zPos = -2.0 - Math.random() * 4;
                const randomScale = baseScale * (0.8 + Math.random() * 0.4);

                treeClone.scale.setScalar(randomScale);
                treeClone.position.set(x + (Math.random() - 0.5) * 2, 0, zPos);
                treeClone.rotation.y = Math.random() * Math.PI * 2;
                treeClone.traverse((child) => {
                  if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
                });
                scene.add(treeClone);
              }
            }
          },
          undefined,
          (err) => console.warn("Modello tree.glb non trovato.", err)
        );
      } else {
        createFallbackEvee();
      }

      setupTouchControls();
      setupCameraJoystickControls();
      startTimer();
      window.addEventListener('resize', onWindowResize);
    }

    function createFallbackPlayer() {
      if (playerWalle) return;
      playerWalle = new THREE.Group();
      const geo = new THREE.BoxGeometry(1.0, playerHeight, 1.0);
      const mat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      playerWalle.add(mesh);
      playerWalle.position.set(0, groundY + playerHalfHeight, foregroundZ);
      scene.add(playerWalle);
      player = playerWalle;
    }

    function createFallbackEvee() {
      if (!playerEvee) {
        playerEvee = new THREE.Group();
        const geo = new THREE.SphereGeometry(0.7, 16, 16);
        const mat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, roughness: 0.2, metalness: 0.8 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        playerEvee.add(mesh);
        playerEvee.position.set(0, 2.5, foregroundZ);
        playerEvee.visible = false;
        scene.add(playerEvee);
      }
      if (introGroup && introGroup.children.length === 1) {
        const fallbackEveeIntro = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 16), new THREE.MeshStandardMaterial({ color: 0x00e5ff }));
        // Segnaposto Evee impostato alle coordinate esatte richieste: X: -4.0, Y: 1.5, Z: 2.0
        fallbackEveeIntro.position.set(-4.0, 1.5, 2.0);
        introGroup.add(fallbackEveeIntro);
      }
      if (!darkWorldEvee) {
        darkWorldEvee = new THREE.Group();
        const fallbackEveeDark = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 16), new THREE.MeshStandardMaterial({ color: 0x00e5ff }));
        darkWorldEvee.add(fallbackEveeDark);
        darkWorldEvee.position.set(22, groundY + 0.7, foregroundZ);
        darkWorldEvee.visible = false;
        scene.add(darkWorldEvee);
      }
    }

    function createIntroDecorations() {
      introGroup = new THREE.Group();
      const wallGeo = new THREE.BoxGeometry(1.0, 3.5, 3);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x5c5666, roughness: 0.7 });
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(introWallX, 1.75, foregroundZ);
      wall.castShadow = true; wall.receiveShadow = true;
      introGroup.add(wall);
      scene.add(introGroup);
    }

    function createLevel() {
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x22112a });

      platforms.forEach(p => {
        const length = p.end - p.start;
        const geo = new THREE.BoxGeometry(length, 2, 15);
        const mesh = new THREE.Mesh(geo, groundMat);
        mesh.position.set(p.start + length / 2, -1, 0);
        mesh.receiveShadow = true;
        scene.add(mesh);
      });

      const ringGeo = new THREE.TorusGeometry(2, 0.3, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
      finishRing = new THREE.Mesh(ringGeo, ringMat);
      finishRing.position.set(100, 2.5, foregroundZ);
      scene.add(finishRing);
    }

    function createPumpkins() {
      pumpkins.forEach(p => {
        const group = new THREE.Group();
        const pumpkinGeo = new THREE.SphereGeometry(p.radius, 16, 12);
        pumpkinGeo.scale(1.2, 0.9, 1.0);
        const pumpkinMat = new THREE.MeshStandardMaterial({ color: 0xe65100, roughness: 0.6, metalness: 0.1 });
        const pumpkinMesh = new THREE.Mesh(pumpkinGeo, pumpkinMat);
        pumpkinMesh.castShadow = true;

    function updateEnemies() {
      const time = Date.now() * 0.005;

      if (currentLevel === 1) {
        pumpkins.forEach(p => {
          if (!p.mesh) return;
          p.mesh.position.x += p.speed * p.dir;
          if (p.mesh.position.x >= p.maxX) { p.mesh.position.x = p.maxX; p.dir = -1; }
          else if (p.mesh.position.x <= p.minX) { p.mesh.position.x = p.minX; p.dir = 1; }
          p.mesh.rotation.y += 0.03 * p.dir;

          if (player && !isGameOver) {
            const dx = player.position.x - p.mesh.position.x;
            const dy = player.position.y - p.mesh.position.y;
            if (Math.sqrt(dx * dx + dy * dy) < (p.radius + 0.5)) {
              endGame(false, "Sei stato colpito da una zucca stregata!");
            }
          }
        });
      } else if (currentLevel === 2) {
        bats.forEach(b => {
          if (!b.mesh) return;
          b.mesh.position.x += b.speed * b.dir;
          if (b.mesh.position.x >= b.maxX) { b.mesh.position.x = b.maxX; b.dir = -1; }
          else if (b.mesh.position.x <= b.minX) { b.mesh.position.x = b.minX; b.dir = 1; }
          b.mesh.position.y = b.baseY + Math.sin(time * 2 + b.minX) * 0.45;
          b.mesh.rotation.y = b.dir === 1 ? Math.PI / 6 : -Math.PI / 6;

          const flapAngle = Math.sin(time * 5) * 0.5;
          if (b.leftWing) b.leftWing.rotation.z = flapAngle;
          if (b.rightWing) b.rightWing.rotation.z = -flapAngle;

          if (player && !isGameOver) {
            const dx = player.position.x - b.mesh.position.x;
            const dy = player.position.y - b.mesh.position.y;
            if (Math.sqrt(dx * dx + dy * dy) < (b.radius + 0.5)) {
              endGame(false, "Sei stato attaccato da un pipistrello della notte!");
            }
          }
        });
      }
    }

    function switchLevel(level) {

      if (level > checkpointLevel) {

      if (introGroup) introGroup.visible = (level === 1);

    function setupTouchControls() {
      const container = document.getElementById('joystick-container');
      const knob = document.getElementById('joystick-knob');
      const maxDistance = 35;

      const handleMove = (clientX, clientY) => {
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const deltaX = clientX - centerX;
        const deltaY = clientY - centerY;

        const clampedX = Math.max(-maxDistance, Math.min(maxDistance, deltaX));
        const clampedY = Math.max(-maxDistance, Math.min(maxDistance, deltaY));
        knob.style.transform = `translate(${clampedX}px, ${clampedY}px)`;

        analogX = clampedX / maxDistance;
        analogY = clampedY / maxDistance;
      };

      const resetAnalog = () => {
        analogX = 0;
        analogY = 0;
        knob.style.transform = `translate(0px, 0px)`;
      };

      container.addEventListener('touchstart', (e) => {
        if (e.cancelable) e.preventDefault();
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      container.addEventListener('touchmove', (e) => {
        if (e.cancelable) e.preventDefault();
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      container.addEventListener('touchend', resetAnalog);
      container.addEventListener('touchcancel', resetAnalog);

      let isMouseDown = false;
      container.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        handleMove(e.clientX, e.clientY);
      });
      window.addEventListener('mousemove', (e) => {
        if (isMouseDown) handleMove(e.clientX, e.clientY);
      });
      window.addEventListener('mouseup', () => {
        if (isMouseDown) {
          isMouseDown = false;
          resetAnalog();
        }
      });

      window.addEventListener('keydown', (e) => {
        if (currentLevel === 3) {
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') analogY = -1;
          if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') analogY = 1;
        }
      });
      window.addEventListener('keyup', (e) => {
        if (currentLevel === 3) {
          if (['ArrowUp', 'ArrowDown', 'w', 'W', 's', 'S'].includes(e.key)) analogY = 0;
        }
      });

      const btnJump = document.getElementById('btn-jump');
      const jumpStart = (e) => {
        if (e.cancelable) e.preventDefault();
        isJumpPressed = true;
        btnJump.classList.add('active');
      };
      const jumpEnd = (e) => {
        if (e.cancelable) e.preventDefault();
        isJumpPressed = false;
        btnJump.classList.remove('active');
      };

      btnJump.addEventListener('touchstart', jumpStart, { passive: false });
      btnJump.addEventListener('touchend', jumpEnd, { passive: false });
      btnJump.addEventListener('mousedown', jumpStart);
      btnJump.addEventListener('mouseup', jumpEnd);
    }

      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 100;
    }

    .hidden {
      display: none !important;
    }

    #status-title {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    #status-desc {
      font-size: 1.2rem;
      margin-bottom: 20px;
      text-align: center;
      white-space: pre-line;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #00e5ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Joystick Touch a Schermo */
    .joystick-zone {
      position: absolute;
      bottom: 30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      touch-action: none;
    }

    #left-joystick-zone { left: 30px; }
    #right-joystick-zone { right: 30px; }

    .joystick-knob {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }
  </style>

  <!-- Inclusion di Three.js da CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Controlli Joystick On-Screen -->
  <div id="left-joystick-zone" class="joystick-zone">
    <div id="left-knob" class="joystick-knob"></div>
  </div>
  <div id="right-joystick-zone" class="joystick-zone">
    <div id="right-knob" class="joystick-knob"></div>
  </div>

  <!-- UI Overlay -->
  <div id="game-over-overlay" class="hidden">
    <h1 id="status-title">VITTORIA ASSOLUTA! 🏆</h1>
    <p id="status-desc"></p>
    <button id="restart-btn" onclick="resetGame()">Ricomincia</button>
  </div>

  <script>
    // --- VARIABILI GLOBALI DI GIOCO ---
    let scene, camera, renderer;
    let player;
    let currentLevel = 4;
    let isGameOver = false;
    let timerInterval = null;
    let checkpointLevel = 4;
    let level4Completed = false;

    // Movimento e Telecamera
    let moveSpeed = 0.15;
    let playerHalfHeight = 0.5;
    let cameraYaw = 0;
    let cameraPitch = 0.4;

    // Input Analogici (-1 a 1)
    let analogX = 0, analogY = 0;
    let camAnalogX = 0, camAnalogY = 0;

    // Oggetti di Gioco del Livello 4
    let hiddenLights = [];
    let lightsActivatedCount = 0;
    let darkWorldEvee = null;
    let heartMesh = null;
    let foregroundZ = 0;

    // --- 1. GENERAZIONE TERRENO DESERTICO CON DISLIVELLI ---
    function getDesertHeight(x, z) {
      return Math.sin(x * 0.15) * Math.cos(z * 0.15) * 1.2 
           + Math.sin(x * 0.05 + z * 0.08) * 1.8 
           + Math.cos(x * 0.3) * 0.4;
    }

    function createDesertTerrain() {
      const width = 80;
      const depth = 60;
      const segments = 80;

      const terrainGeo = new THREE.PlaneGeometry(width, depth, segments, segments);
      terrainGeo.rotateX(-Math.PI / 2);

      const posAttr = terrainGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const z = posAttr.getZ(i);
        posAttr.setY(i, getDesertHeight(x, z));
      }

      terrainGeo.computeVertexNormals();

      const terrainMat = new THREE.MeshStandardMaterial({
        color: 0xddb475, // Sabbia deserto
        roughness: 0.85,
        metalness: 0.1,
        flatShading: true
      });

      const desertMesh = new THREE.Mesh(terrainGeo, terrainMat);
      desertMesh.receiveShadow = true;
      return desertMesh;
    }

    // --- 2. INIZIALIZZAZIONE SCENA E LIVELLO 4 ---
    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd4a373);
      scene.fog = new THREE.FogExp2(0xd4a373, 0.025);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Luci Ambiente e Solare
      const ambientLight = new THREE.AmbientLight(0xffedd8, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      // Aggiungi Terreno Desertico
      const terrain = createDesertTerrain();
      scene.add(terrain);

      // Placeholder per Wall-E (Mesh cubo o caricatore GLTF)
      const playerGeo = new THREE.BoxGeometry(1, 1, 1);
      const playerMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
      player = new THREE.Mesh(playerGeo, playerMat);
      player.position.set(0, getDesertHeight(0, 0) + playerHalfHeight, 0);
      scene.add(player);

      // Placeholder per Evee (Obiettivo)
      const eveeGeo = new THREE.SphereGeometry(0.6, 16, 16);
      const eveeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x888888 });
      darkWorldEvee = new THREE.Mesh(eveeGeo, eveeMat);
      darkWorldEvee.position.set(10, getDesertHeight(10, foregroundZ) + 0.6, foregroundZ);
      darkWorldEvee.visible = false;
      scene.add(darkWorldEvee);

      // Generazione 3 Luci Nascoste da Attivare
      setupHiddenLights();

      // Configurazione Input Touch / Tastiera
      setupControls();

      window.addEventListener('resize', onWindowResize, false);
      
      // Avvio Loop di Animazione
      animate();
    }

    function setupHiddenLights() {
      hiddenLights = [];
      const lightPositions = [
        { x: -5, z: 5 },
        { x: 12, z: -4 },
        { x: 5, z: 8 }
      ];

      lightPositions.forEach(pos => {
        const y = getDesertHeight(pos.x, pos.z) + 0.5;
        const meshGeo = new THREE.CylinderGeometry(0.2, 0.2, 1);
        const meshMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const mesh = new THREE.Mesh(meshGeo, meshMat);
        mesh.position.set(pos.x, y, pos.z);

        const pointLight = new THREE.PointLight(0x00ffff, 0, 10);
        pointLight.position.set(pos.x, y + 1, pos.z);

        scene.add(mesh);
        scene.add(pointLight);

        hiddenLights.push({
          x: pos.x,
          z: pos.z,
          mesh: mesh,
          pointLight: pointLight,
          activated: false
        });
      });
    }

    // --- 3. AGGIORNAMENTO MOVIMENTO LIVELLO 4 ---
    function updatePlayerMovement() {
      if (isGameOver) return;

      if (currentLevel == 4) {
        if (!player) return;

        // Inizializzazione di sicurezza contro i valori NaN
        if (isNaN(cameraYaw)) cameraYaw = 0;
        const safeHalfHeight = (typeof playerHalfHeight !== 'undefined' && !isNaN(playerHalfHeight)) ? playerHalfHeight : 0.5;
        const safeSpeed = (typeof moveSpeed !== 'undefined' && moveSpeed > 0) ? moveSpeed : 0.15;

        // 1. Calcolo dinamico dell'altezza del terreno
        const currentGroundY = getDesertHeight(player.position.x, player.position.z);
        player.position.y = currentGroundY + safeHalfHeight;

        let moveX = 0;
        let moveZ = 0;

        const inputX = analogX || 0;
        const inputY = analogY || 0;

        // 2. Movimento orientato alla telecamera (cameraYaw)
        if (Math.abs(inputX) > 0.15 || Math.abs(inputY) > 0.15) {
          const camForwardX = -Math.sin(cameraYaw);
          const camForwardZ = -Math.cos(cameraYaw);
          const camRightX = Math.cos(cameraYaw);
          const camRightZ = -Math.sin(cameraYaw);

          const inputForward = -inputY; // Leva su = avanti
          const inputRight = inputX;    // Leva destra = destra

          moveX = (camRightX * inputRight + camForwardX * inputForward) * safeSpeed;
          moveZ = (camRightZ * inputRight + camForwardZ * inputForward) * safeSpeed;

          // Orientamento visivo del personaggio
          player.rotation.y = Math.atan2(moveX, moveZ);
        }

        // Limiti della mappa
        player.position.x = Math.max(-15, Math.min(35, player.position.x + moveX));
        player.position.z = Math.max(-8, Math.min(12, player.position.z + moveZ));

        // 3. Controllo vista telecamera con l'analogico destro
        const camInX = camAnalogX || 0;
        const camInY = camAnalogY || 0;

        if (Math.abs(camInX) > 0.1) {
          cameraYaw -= camInX * 0.04;
        }
        if (Math.abs(camInY) > 0.1) {
          cameraPitch = Math.max(0.1, Math.min(1.2, cameraPitch + camInY * 0.03));
        }

        // 4. Posizionamento della telecamera in orbita attorno al giocatore
        const camDistanceLvl4 = 8.0;
        const camX = player.position.x + camDistanceLvl4 * Math.sin(cameraYaw) * Math.cos(cameraPitch);
        const camY = player.position.y + camDistanceLvl4 * Math.sin(cameraPitch) + 1.2;
        const camZ = player.position.z + camDistanceLvl4 * Math.cos(cameraYaw) * Math.cos(cameraPitch);

        camera.position.set(camX, camY, camZ);
        camera.lookAt(player.position.x, player.position.y + 0.8, player.position.z);

        // 5. Attivazione delle 3 luci nascoste nel livello
        hiddenLights.forEach(l => {
          if (!l.activated) {
            const dx = player.position.x - l.x;
            const dz = player.position.z - l.z;
            if (Math.sqrt(dx * dx + dz * dz) < 1.3) {
              l.activated = true;
              l.mesh.material.color.setHex(0x00ffff);
              l.pointLight.intensity = 4.0;
              lightsActivatedCount++;

              if (lightsActivatedCount >= 3) {
                if (darkWorldEvee) darkWorldEvee.visible = true;
              }
            }
          }
        });

        // 6. Condizione di vittoria finale
        if (lightsActivatedCount >= 3 && darkWorldEvee && darkWorldEvee.visible) {
          const dx = player.position.x - darkWorldEvee.position.x;
          const dz = player.position.z - foregroundZ;
          if (Math.sqrt(dx * dx + dz * dz) < 1.5) {
            if (!level4Completed) {
              level4Completed = true;
              if (heartMesh) heartMesh.visible = true;
              endGame(true, "VITTORIA FINALE! 🤖❤️✨\nWalle ed Evee si sono ritrovati!");
            }
          }
        }
      }
    }

    function updateEnemies() {
      // Spazio riservato alla logica dei nemici
    }

    function endGame(victory, message) {
      isGameOver = true;
      if (timerInterval) clearInterval(timerInterval);

      const overlay = document.getElementById('game-over-overlay');
      const title = document.getElementById('status-title');
      const desc = document.getElementById('status-desc');

      title.innerText = victory ? "VITTORIA ASSOLUTA! 🏆" : "MISSIONE FALLITA 👻";
      title.style.color = victory ? "#00e5ff" : "#ff3300";
      desc.innerText = message;

      const restartBtn = document.getElementById('restart-btn');
      restartBtn.innerText = victory ? "Rigioca dal Checkpoint" : `Ricomincia da Lvl ${checkpointLevel}`;

      overlay.classList.remove('hidden');
    }

    function resetGame() {
      isGameOver = false;
      lightsActivatedCount = 0;
      level4Completed = false;
      document.getElementById('game-over-overlay').classList.add('hidden');
      
      // Reset posizione Wall-E
      if (player) {
        player.position.set(0, getDesertHeight(0, 0) + playerHalfHeight, 0);
      }
      if (darkWorldEvee) darkWorldEvee.visible = false;

      hiddenLights.forEach(l => {
        l.activated = false;
        l.mesh.material.color.setHex(0x555555);
        l.pointLight.intensity = 0;
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();
      updateEnemies();
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- 4. GESTIONE CONTROLLI TOUCH & TASTIERA (Per test da PC) ---
    function setupControls() {
      setupVirtualJoystick('left-joystick-zone', 'left-knob', (x, y) => {
        analogX = x;
        analogY = y;
      });

      setupVirtualJoystick('right-joystick-zone', 'right-knob', (x, y) => {
        camAnalogX = x;
        camAnalogY = y;
      });

      // Controlli Tastiera Fallback (WASD / Frecce per PC)
      const keys = {};
      window.addEventListener('keydown', e => { keys[e.key] = true; updateKeyboardAnalog(); });
      window.addEventListener('keyup', e => { keys[e.key] = false; updateKeyboardAnalog(); });

      function updateKeyboardAnalog() {
        analogX = (keys['d'] || keys['ArrowRight'] ? 1 : 0) - (keys['a'] || keys['ArrowLeft'] ? 1 : 0);
        analogY = (keys['s'] || keys['ArrowDown'] ? 1 : 0) - (keys['w'] || keys['ArrowUp'] ? 1 : 0);
      }
    }

    function setupVirtualJoystick(zoneId, knobId, onChange) {
      const zone = document.getElementById(zoneId);
      const knob = document.getElementById(knobId);
      let touchId = null;
      let startX = 0, startY = 0;
      const maxRadius = 40;

      function handleStart(e) {
        const touch = e.changedTouches ? e.changedTouches[0] : e;
        touchId = touch.identifier !== undefined ? touch.identifier : 'mouse';
        startX = touch.clientX;
        startY = touch.clientY;
      }

      function handleMove(e) {
        if (touchId === null) return;
        let touch = null;
        if (e.changedTouches) {
          for (let t of e.changedTouches) {
            if (t.identifier === touchId) { touch = t; break; }
          }
        } else {
          touch = e;
        }

        if (!touch) return;

        let dx = touch.clientX - startX;
        let dy = touch.clientY - startY;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > maxRadius) {
          dx = (dx / dist) * maxRadius;
          dy = (dy / dist) * maxRadius;
        }

        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        onChange(dx / maxRadius, dy / maxRadius);
      }

      function handleEnd(e) {
        knob.style.transform = `translate(0px, 0px)`;
        touchId = null;
        onChange(0, 0);
      }

      zone.addEventListener('touchstart', handleStart, false);
      window.addEventListener('touchmove', handleMove, false);
      window.addEventListener('touchend', handleEnd, false);

      zone.addEventListener('mousedown', handleStart, false);
      window.addEventListener('mousemove', handleMove, false);
      window.addEventListener('mouseup', handleEnd, false);
    }

    // Avvio del gioco al caricamento della pagina
    window.onload = init;
  </script>
</body>
</html>
