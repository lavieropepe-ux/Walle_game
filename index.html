<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walle08 - Visualizzatore 3D</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #11111d);
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      pointer-events: none;
      z-index: 10;
    }
    #ui-overlay h1 {
      margin: 0 0 5px 0;
      font-size: 20px;
      color: #00d2ff;
    }
    #ui-overlay p {
      margin: 0;
      font-size: 13px;
      color: #cccccc;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: bold;
      color: #00d2ff;
      background: rgba(0,0,0,0.7);
      padding: 15px 30px;
      border-radius: 25px;
      pointer-events: none;
      transition: opacity 0.5s;
      z-index: 20;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <!-- Importmap per Three.js e OrbitControls -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="ui-overlay">
    <h1>Walle08 3D Viewer</h1>
    <p>🖱️ <b>Click + Trascina:</b> Ruota la vista</p>
    <p>🔍 <b>Rotella del mouse:</b> Zoom in / Zoom out</p>
    <p>✋ <b>Click Destro + Trascina:</b> Sposta la telecamera</p>
  </div>

  <div id="loading">Caricamento walle08.glb...</div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls, model;

    init();
    animate();

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scena
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a24);

      // 2. Telecamera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 5);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 4. Controlli per girare attorno al modello
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 + 0.1; // Limite sotto il pavimento

      // 5. Illuminazione Studio
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
      mainLight.position.set(5, 10, 7.5);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 2048;
      mainLight.shadow.mapSize.height = 2048;
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0x00d2ff, 1.0);
      fillLight.position.set(-5, 0, -5);
      scene.add(fillLight);

      // 6. Terreno / Griglia Elegante
      const gridHelper = new THREE.GridHelper(20, 20, 0x00d2ff, 0x444444);
      gridHelper.position.y = 0;
      scene.add(gridHelper);

      // 7. Caricamento Modello walle08.glb
      const loader = new GLTFLoader();
      const loadingEl = document.getElementById('loading');

      loader.load(
        './walle08.glb',
        (gltf) => {
          model = gltf.scene;

          // Auto-centratura e Ridimensionamento Automatico
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());

          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 2 / (maxDim || 1); // Ridimensiona in modo che si veda perfettamente
          model.scale.setScalar(scale);

          // Riposiziona al centro della griglia
          box.setFromObject(model);
          box.getCenter(center);
          model.position.sub(center);
          model.position.y += (size.y * scale) / 2;

          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });

          scene.add(model);

          // Punta i controlli al centro del modello
          controls.target.set(0, (size.y * scale) / 2, 0);
          controls.update();

          // Nascondi il messaggio di caricamento
          loadingEl.classList.add('hidden');
        },
        (xhr) => {
          if (xhr.total > 0) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            loadingEl.innerText = `Caricamento: ${percent}%`;
          }
        },
        (error) => {
          console.error("Errore nel caricamento del file walle08.glb", error);
          loadingEl.innerText = "⚠️ Impossibile trovare 'walle08.glb'";
          loadingEl.style.color = "#ff4d4d";
        }
      );

      window.addEventListener('resize', onWindowResize);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
