<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Walle08 - Halloween Nightmare Platformer</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0814;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(20, 10, 30, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 140, 0, 0.4);
      pointer-events: none;
      z-index: 10;
      font-size: 18px;
      font-weight: bold;
      color: #ff9d00;
      box-shadow: 0 0 15px rgba(255, 120, 0, 0.2);
      display: flex;
      gap: 15px;
    }

    #level-transition-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 5, 20, 0.9);
      border: 2px solid #ff9d00;
      padding: 20px 40px;
      border-radius: 16px;
      text-align: center;
      z-index: 25;
      box-shadow: 0 0 25px rgba(255, 140, 0, 0.6);
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    #level-transition-banner.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #level-transition-banner h2 {
      margin: 0;
      font-size: 32px;
      color: #ffaa00;
      text-shadow: 0 0 10px #ff4500;
    }

    #game-over-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 5, 15, 0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: white; z-index: 30;
    }
    #game-over-overlay.hidden { display: none; }
    #game-over-overlay h1 { font-size: 42px; margin-bottom: 10px; text-shadow: 0 0 10px #ff4500; text-align: center; }
    #game-over-overlay p { font-size: 18px; margin-bottom: 20px; color: #dcdcdc; text-align: center; max-width: 80%; }
    #restart-btn {
      padding: 12px 28px; font-size: 18px; font-weight: bold; color: #fff;
      background: #d35400; border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 10px rgba(211, 84, 0, 0.5); transition: background 0.2s;
    }
    #restart-btn:hover { background: #e67e22; }

    /* JOYSTICK ANALOGICO */
    #joystick-container {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 110px;
      height: 110px;
      background: rgba(40, 20, 60, 0.4);
      border: 2px solid rgba(255, 140, 0, 0.6);
      border-radius: 50%;
      z-index: 20;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }
    #joystick-knob {
      width: 50px;
      height: 50px;
      background: rgba(255, 140, 0, 0.85);
      border: 2px solid #ffaa00;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 140, 0, 0.6);
      transition: transform 0.05s ease-out;
      pointer-events: none;
    }

    /* PULSANTE SALTO */
    #btn-jump {
      position: absolute;
      bottom: 30px;
      right: 25px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(142, 68, 173, 0.85);
      border: 2px solid rgba(255, 140, 0, 0.7);
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      touch-action: none;
      box-shadow: 0 4px 15px rgba(142, 68, 173, 0.6);
      backdrop-filter: blur(4px);
    }
    #btn-jump:active, #btn-jump.active {
      background: rgba(155, 89, 182, 1);
      transform: scale(0.95);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <div>🏷️ <span id="level-display">Livello 1</span></div>
    <div>⏱️ Tempo: <span id="timer">40</span>s</div>
  </div>

  <div id="level-transition-banner" class="hidden">
    <h2 id="banner-title">LIVELLO 2</h2>
    <p style="margin: 5px 0 0 0; color: #e0e0e0;">Attento ai Pipistrelli Volanti!</p>
  </div>

  <div id="game-over-overlay" class="hidden">
    <h1 id="status-title">GAME OVER</h1>
    <p id="status-desc">Sei caduto nel vuoto!</p>
    <button id="restart-btn" onclick="resetGame()">Ricomincia</button>
  </div>

  <div id="joystick-container">
    <div id="joystick-knob"></div>
  </div>

  <div id="btn-jump">SALTO</div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, player, finishRing;
    let currentLevel = 1;
    let isGameOver = false;

    let timeLeft = 40;
    let timerInterval;

    let analogX = 0;
    let isJumpPressed = false;

    const moveSpeed = 0.16;
    let velocityY = 0;
    const gravity = -0.016;
    const jumpStrength = 0.38;
    let isGrounded = true;
    
    // Parametri Terreno
    const groundY = 0.0;
    const foregroundZ = 2.0;

    const playerHalfWidth = 0.5;
    const playerHeight = 1.6;
    const playerHalfHeight = playerHeight / 2;

    const platforms = [
      { start: -10, end: 15 },
      { start: 20, end: 40 },
      { start: 47, end: 70 },
      { start: 77, end: 110 }
    ];

    // Ostacoli fisici
    const obstacles = [
      { x: 5, width: 1.5, height: 1.5 },
      { x: 30, width: 1.5, height: 1.5 },
      { x: 58, width: 1.5, height: 1.5 },
      { x: 88, width: 1.5, height: 1.5 }
    ];

    // Nemici Livello 1: Zucche
    const pumpkins = [
      { minX: 8, maxX: 14, posY: 0.8, speed: 0.08, dir: 1, radius: 0.6, mesh: null },
      { minX: 22, maxX: 28, posY: 0.8, speed: 0.1, dir: 1, radius: 0.6, mesh: null },
      { minX: 33, maxX: 39, posY: 2.1, speed: 0.09, dir: -1, radius: 0.6, mesh: null },
      { minX: 50, maxX: 56, posY: 0.8, speed: 0.11, dir: 1, radius: 0.6, mesh: null },
      { minX: 61, maxX: 68, posY: 1.9, speed: 0.1, dir: -1, radius: 0.6, mesh: null },
      { minX: 80, maxX: 86, posY: 0.8, speed: 0.12, dir: 1, radius: 0.6, mesh: null }
    ];

    // Nemici Livello 2: Pipistrelli volanti
    const bats = [
      { minX: 7, maxX: 14, baseY: 1.6, speed: 0.09, dir: 1, mesh: null, leftWing: null, rightWing: null, radius: 0.55 },
      { minX: 21, maxX: 29, baseY: 2.2, speed: 0.11, dir: -1, mesh: null, leftWing: null, rightWing: null, radius: 0.55 },
      { minX: 32, maxX: 39, baseY: 1.4, speed: 0.1, dir: 1, mesh: null, leftWing: null, rightWing: null, radius: 0.55 },
      { minX: 49, maxX: 57, baseY: 2.5, speed: 0.12, dir: -1, mesh: null, leftWing: null, rightWing: null, radius: 0.55 },
      { minX: 60, maxX: 69, baseY: 1.8, speed: 0.11, dir: 1, mesh: null, leftWing: null, rightWing: null, radius: 0.55 },
      { minX: 79, maxX: 87, baseY: 2.0, speed: 0.13, dir: -1, mesh: null, leftWing: null, rightWing: null, radius: 0.55 }
    ];

    const cameraHeight = 3.5;
    const cameraDistance = 14.0;

    window.onload = () => {
      init();
      animate();
    };

    function generateHalloweenSkyTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#05020a');
      grad.addColorStop(0.5, '#180a29');
      grad.addColorStop(0.85, '#3a1322');
      grad.addColorStop(1, '#5e2105');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const moonX = 750;
      const moonY = 250;
      const moonRadius = 90;

      const moonGlow = ctx.createRadialGradient(moonX, moonY, moonRadius * 0.5, moonX, moonY, moonRadius * 3);
      moonGlow.addColorStop(0, 'rgba(255, 230, 180, 0.8)');
      moonGlow.addColorStop(0.4, 'rgba(255, 140, 0, 0.25)');
      moonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = moonGlow;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonRadius * 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff4db';
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 150; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * (canvas.height * 0.7);
        const r = Math.random() * 1.5;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      return new THREE.CanvasTexture(canvas);
    }

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = generateHalloweenSkyTexture();
      scene.fog = new THREE.FogExp2(0x1a0a2a, 0.015);

      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, cameraHeight, cameraDistance);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0x8a55a5, 1.2);
      scene.add(ambientLight);

      const moonLight = new THREE.DirectionalLight(0xffa500, 1.5);
      moonLight.position.set(10, 20, 15);
      moonLight.castShadow = true;
      scene.add(moonLight);

      createLevel();
      createPumpkins();
      createBats();
      createFallbackPlayer();

      if (typeof THREE.GLTFLoader !== 'undefined') {
        const loader = new THREE.GLTFLoader();

        // 1. CARICAMENTO OSTACOLO GLB (bott1_02_1024.glb)
        loader.load(
          './bott1_02_1024.glb',
          (gltf) => {
            const rawModel = gltf.scene;

            const rawBox = new THREE.Box3().setFromObject(rawModel);
            const rawSize = rawBox.getSize(new THREE.Vector3());
            const rawCenter = rawBox.getCenter(new THREE.Vector3());

            const targetHeight = 1.6;
            const scaleFactor = targetHeight / (rawSize.y || 1);

            const realWidth = rawSize.x * scaleFactor;
            const realHeight = rawSize.y * scaleFactor;

            const centeredWrapper = new THREE.Group();
            rawModel.position.set(-rawCenter.x, -rawBox.min.y, -rawCenter.z);
            centeredWrapper.add(rawModel);
            centeredWrapper.scale.setScalar(scaleFactor);

            obstacles.forEach(obs => {
              const obsInstance = centeredWrapper.clone();
              obsInstance.position.set(obs.x, 0, foregroundZ);

              obsInstance.traverse((child) => {
                if (child.isMesh) {
                  child.castShadow = true;
                  child.receiveShadow = true;
                }
              });

              scene.add(obsInstance);

              obs.width = realWidth;
              obs.height = realHeight;
            });
          },
          undefined,
          (err) => console.warn("Errore caricamento bott1_02_1024.glb:", err)
        );

        // 2. PERSONAGGIO (walle08.glb)
        loader.load(
          './walle08.glb',
          (gltf) => {
            if (player) scene.remove(player);

            const loadedModel = gltf.scene;
            const box = new THREE.Box3().setFromObject(loadedModel);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = playerHeight / (maxDim || 1);
            
            loadedModel.scale.setScalar(scale);
            box.setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            loadedModel.position.sub(center);

            player = new THREE.Group();
            player.add(loadedModel);
            player.position.set(0, groundY + playerHalfHeight, foregroundZ);

            player.traverse((child) => {
              if (child.isMesh) child.castShadow = true;
            });

            scene.add(player);
          },
          undefined,
          (err) => console.warn("Modello walle08.glb non trovato, uso il segnaposto.", err)
        );

        // 3. ALBERI DI SFONDO (tree.glb)
        loader.load(
          './tree.glb',
          (gltf) => {
            const baseTree = gltf.scene;
            const box = new THREE.Box3().setFromObject(baseTree);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const baseScale = 3.5 / (maxDim || 1);

            for (let x = -10; x <= 110; x += 7) {
              const isOverHole = !platforms.some(p => x >= p.start && x <= p.end);
              if (isOverHole) continue;

              if (Math.random() > 0.3) {
                const treeClone = baseTree.clone();
                const zPos = -2.0 - Math.random() * 4;
                const randomScale = baseScale * (0.8 + Math.random() * 0.4);

                treeClone.scale.setScalar(randomScale);
                treeClone.position.set(x + (Math.random() - 0.5) * 2, 0, zPos);
                treeClone.rotation.y = Math.random() * Math.PI * 2;

                treeClone.traverse((child) => {
                  if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                  }
                });

                scene.add(treeClone);
              }
            }
          },
          undefined,
          (err) => console.warn("Modello tree.glb non trovato.", err)
        );
      }

      setupTouchControls();
      startTimer();
      window.addEventListener('resize', onWindowResize);
    }

    function createFallbackPlayer() {
      player = new THREE.Group();
      const geo = new THREE.BoxGeometry(1.0, playerHeight, 1.0);
      const mat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      player.add(mesh);
      player.position.set(0, groundY + playerHalfHeight, foregroundZ);
      scene.add(player);
    }

    function createLevel() {
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x22112a });

      platforms.forEach(p => {
        const length = p.end - p.start;
        const geo = new THREE.BoxGeometry(length, 2, 15);
        const mesh = new THREE.Mesh(geo, groundMat);
        mesh.position.set(p.start + length / 2, -1, 0);
        mesh.receiveShadow = true;
        scene.add(mesh);
      });

      const ringGeo = new THREE.TorusGeometry(2, 0.3, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
      finishRing = new THREE.Mesh(ringGeo, ringMat);
      finishRing.position.set(100, 2.5, foregroundZ);
      scene.add(finishRing);
    }

    function createPumpkins() {
      pumpkins.forEach(p => {
        const group = new THREE.Group();

        const pumpkinGeo = new THREE.SphereGeometry(p.radius, 16, 12);
        pumpkinGeo.scale(1.2, 0.9, 1.0);
        const pumpkinMat = new THREE.MeshStandardMaterial({ 
          color: 0xe65100, 
          roughness: 0.6,
          metalness: 0.1 
        });
        const pumpkinMesh = new THREE.Mesh(pumpkinGeo, pumpkinMat);
        pumpkinMesh.castShadow = true;
        group.add(pumpkinMesh);

        const stemGeo = new THREE.CylinderGeometry(0.05, 0.08, 0.3, 8);
        const stemMat = new THREE.MeshBasicMaterial({ color: 0x2e7d32 });
        const stem = new THREE.Mesh(stemGeo, stemMat);
        stem.position.set(0, p.radius * 0.85, 0);
        stem.rotation.z = -0.2;
        group.add(stem);

        const eyeGeo = new THREE.ConeGeometry(0.12, 0.1, 3);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffd600 });
        
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.2, 0.1, p.radius * 0.85);
        leftEye.rotation.x = Math.PI / 2;
        group.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.2, 0.1, p.radius * 0.85);
        rightEye.rotation.x = Math.PI / 2;
        group.add(rightEye);

        const fireLight = new THREE.PointLight(0xff6d00, 3, 5);
        fireLight.position.set(0, 0, p.radius * 0.5);
        group.add(fireLight);

        group.position.set(p.minX, p.posY, foregroundZ);
        p.mesh = group;
        scene.add(p.mesh);
      });
    }

    function createBats() {
      bats.forEach(b => {
        const batGroup = new THREE.Group();
        const batMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.5 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        // Corpo
        const bodyGeo = new THREE.SphereGeometry(0.35, 12, 12);
        bodyGeo.scale(1, 1.2, 0.8);
        const body = new THREE.Mesh(bodyGeo, batMat);
        body.castShadow = true;
        batGroup.add(body);

        // Occhi rossi
        const eyeGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.12, 0.1, 0.28);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.12, 0.1, 0.28);
        batGroup.add(leftEye, rightEye);

        // Orecchie
        const earGeo = new THREE.ConeGeometry(0.1, 0.25, 4);
        const leftEar = new THREE.Mesh(earGeo, batMat);
        leftEar.position.set(-0.18, 0.38, 0);
        leftEar.rotation.z = -0.3;
        const rightEar = new THREE.Mesh(earGeo, batMat);
        rightEar.position.set(0.18, 0.38, 0);
        rightEar.rotation.z = 0.3;
        batGroup.add(leftEar, rightEar);

        // Ala Sinistra
        const leftWingGroup = new THREE.Group();
        leftWingGroup.position.set(-0.25, 0.05, 0);
        const wingShape = new THREE.Shape();
        wingShape.moveTo(0, 0);
        wingShape.lineTo(-0.7, 0.3);
        wingShape.lineTo(-0.9, -0.2);
        wingShape.lineTo(-0.5, -0.4);
        wingShape.lineTo(-0.2, -0.15);
        wingShape.closePath();
        const wingGeo = new THREE.ShapeGeometry(wingShape);
        const leftWing = new THREE.Mesh(wingGeo, batMat);
        leftWingGroup.add(leftWing);
        batGroup.add(leftWingGroup);

        // Ala Destra
        const rightWingGroup = new THREE.Group();
        rightWingGroup.position.set(0.25, 0.05, 0);
        const rightWingShape = new THREE.Shape();
        rightWingShape.moveTo(0, 0);
        rightWingShape.lineTo(0.7, 0.3);
        rightWingShape.lineTo(0.9, -0.2);
        rightWingShape.lineTo(0.5, -0.4);
        rightWingShape.lineTo(0.2, -0.15);
        rightWingShape.closePath();
        const rightWingGeo = new THREE.ShapeGeometry(rightWingShape);
        const rightWing = new THREE.Mesh(rightWingGeo, batMat);
        rightWingGroup.add(rightWingGroup);
        batGroup.add(rightWingGroup);

        batGroup.position.set(b.minX, b.baseY, foregroundZ);
        batGroup.visible = false; // Invisibile al livello 1

        b.mesh = batGroup;
        b.leftWing = leftWingGroup;
        b.rightWing = rightWingGroup;

        scene.add(batGroup);
      });
    }

    function updateEnemies() {
      const time = Date.now() * 0.005;

      if (currentLevel === 1) {
        pumpkins.forEach(p => {
          if (!p.mesh) return;
          p.mesh.position.x += p.speed * p.dir;

          if (p.mesh.position.x >= p.maxX) {
            p.mesh.position.x = p.maxX;
            p.dir = -1;
          } else if (p.mesh.position.x <= p.minX) {
            p.mesh.position.x = p.minX;
            p.dir = 1;
          }

          p.mesh.rotation.y += 0.03 * p.dir;

          if (player && !isGameOver) {
            const dx = player.position.x - p.mesh.position.x;
            const dy = player.position.y - p.mesh.position.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < (p.radius + 0.5)) {
              endGame(false, "Sei stato colpito da una zucca stregata!");
            }
          }
        });
      } else if (currentLevel === 2) {
        bats.forEach(b => {
          if (!b.mesh) return;

          // Movimento Orizzontale
          b.mesh.position.x += b.speed * b.dir;
          if (b.mesh.position.x >= b.maxX) {
            b.mesh.position.x = b.maxX;
            b.dir = -1;
          } else if (b.mesh.position.x <= b.minX) {
            b.mesh.position.x = b.minX;
            b.dir = 1;
          }

          // Movimento Sinusoidale Volante in Alto/Basso
          b.mesh.position.y = b.baseY + Math.sin(time * 2 + b.minX) * 0.45;

          // Orientamento in base alla direzione
          b.mesh.rotation.y = b.dir === 1 ? Math.PI / 6 : -Math.PI / 6;

          // Battito delle ali
          const flapAngle = Math.sin(time * 5) * 0.5;
          if (b.leftWing) b.leftWing.rotation.z = flapAngle;
          if (b.rightWing) b.rightWing.rotation.z = -flapAngle;

          // Collisione col Giocatore
          if (player && !isGameOver) {
            const dx = player.position.x - b.mesh.position.x;
            const dy = player.position.y - b.mesh.position.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < (b.radius + 0.5)) {
              endGame(false, "Sei stato attaccato da un pipistrello della notte!");
            }
          }
        });
      }
    }

    function switchLevel(level) {
      currentLevel = level;
      document.getElementById('level-display').innerText = `Livello ${currentLevel}`;

      if (level === 2) {
        // Nascondi Zucche e mostra Pipistrelli
        pumpkins.forEach(p => { if (p.mesh) p.mesh.visible = false; });
        bats.forEach(b => { if (b.mesh) b.mesh.visible = true; });

        // Posiziona il giocatore all'inizio del livello
        if (player) {
          player.position.set(0, groundY + playerHalfHeight, foregroundZ);
          velocityY = 0;
        }

        // Banner Transizione
        const banner = document.getElementById('level-transition-banner');
        banner.classList.remove('hidden');
        setTimeout(() => {
          banner.classList.add('hidden');
        }, 2500);

        // Reset Timer per il livello 2
        timeLeft = 40;
        document.getElementById('timer').innerText = timeLeft;
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (isGameOver) return;
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;

        if (timeLeft <= 0) {
          endGame(false, "Tempo Scaduto!");
        }
      }, 1000);
    }

    function setupTouchControls() {
      const container = document.getElementById('joystick-container');
      const knob = document.getElementById('joystick-knob');
      const maxDistance = 35;

      const handleMove = (clientX, clientY) => {
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const deltaX = clientX - centerX;

        const clampedX = Math.max(-maxDistance, Math.min(maxDistance, deltaX));
        knob.style.transform = `translateX(${clampedX}px)`;

        analogX = clampedX / maxDistance;
      };

      const resetAnalog = () => {
        analogX = 0;
        knob.style.transform = `translateX(0px)`;
      };

      container.addEventListener('touchstart', (e) => {
        if (e.cancelable) e.preventDefault();
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      container.addEventListener('touchmove', (e) => {
        if (e.cancelable) e.preventDefault();
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      container.addEventListener('touchend', resetAnalog);
      container.addEventListener('touchcancel', resetAnalog);

      let isMouseDown = false;
      container.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        handleMove(e.clientX, e.clientY);
      });
      window.addEventListener('mousemove', (e) => {
        if (isMouseDown) handleMove(e.clientX, e.clientY);
      });
      window.addEventListener('mouseup', () => {
        if (isMouseDown) {
          isMouseDown = false;
          resetAnalog();
        }
      });

      const btnJump = document.getElementById('btn-jump');
      const jumpStart = (e) => {
        if (e.cancelable) e.preventDefault();
        isJumpPressed = true;
        btnJump.classList.add('active');
      };
      const jumpEnd = (e) => {
        if (e.cancelable) e.preventDefault();
        isJumpPressed = false;
        btnJump.classList.remove('active');
      };

      btnJump.addEventListener('touchstart', jumpStart, { passive: false });
      btnJump.addEventListener('touchend', jumpEnd, { passive: false });
      btnJump.addEventListener('mousedown', jumpStart);
      btnJump.addEventListener('mouseup', jumpEnd);
    }

    function updatePlayerMovement() {
      if (!player || isGameOver) return;

      // 1. Fisica verticale
      player.position.y += velocityY;
      velocityY += gravity;

      const currentX = player.position.x;
      const onPlatform = platforms.some(p => currentX >= p.start && currentX <= p.end);
      
      let floorY = onPlatform ? (groundY + playerHalfHeight) : -99;

      // Gestione atterraggio sopra gli ostacoli
      obstacles.forEach(obs => {
        const obsTopCenter = obs.height + playerHalfHeight;
        const obsMinX = obs.x - (obs.width / 2) - playerHalfWidth + 0.05;
        const obsMaxX = obs.x + (obs.width / 2) + playerHalfWidth - 0.05;

        if (player.position.x > obsMinX && player.position.x < obsMaxX) {
          if (player.position.y >= obsTopCenter - 0.2) {
            floorY = Math.max(floorY, obsTopCenter);
          }
        }
      });

      if (player.position.y <= floorY) {
        player.position.y = floorY;
        velocityY = 0;
        isGrounded = true;
      } else {
        isGrounded = false;
      }

      // 2. Movimento Orizzontale
      let intendedX = player.position.x;

      if (Math.abs(analogX) > 0.15) {
        intendedX += analogX * moveSpeed;
        
        if (analogX > 0) {
          player.rotation.y = Math.PI / 2;
        } else if (analogX < 0) {
          player.rotation.y = -Math.PI / 2;
        }
      }

      // Collisioni laterali con gli ostacoli
      obstacles.forEach(obs => {
        const obsMinX = obs.x - (obs.width / 2) - playerHalfWidth;
        const obsMaxX = obs.x + (obs.width / 2) + playerHalfWidth;
        const obsTopCenter = obs.height + playerHalfHeight;

        if (player.position.y < obsTopCenter - 0.1) {
          if (player.position.x <= obsMinX && intendedX > obsMinX) {
            intendedX = obsMinX;
          }
          if (player.position.x >= obsMaxX && intendedX < obsMaxX) {
            intendedX = obsMaxX;
          }
        }
      });

      player.position.x = intendedX;
      player.position.z = foregroundZ;

      // Comando Salto
      if (isJumpPressed && isGrounded) {
        velocityY = jumpStrength;
        isGrounded = false;
      }

      // Sconfitta per caduta
      if (player.position.y < -6) {
        endGame(false, "Sei caduto nell'oscurità!");
      }

      // Traguardo e avanzamento di livello
      if (player.position.x >= 98) {
        if (currentLevel === 1) {
          switchLevel(2);
        } else if (currentLevel === 2) {
          endGame(true, `VITTORIA FINALE! 🎃👻\nHai completato entrambi i livelli di Halloween in ${timeLeft}s!`);
        }
      }

      if (finishRing) finishRing.rotation.y += 0.02;

      // Telecamera
      camera.position.x = player.position.x;
      camera.position.y = cameraHeight;
      camera.position.z = cameraDistance;
      camera.lookAt(player.position.x, cameraHeight - 0.5, foregroundZ);
    }

    function endGame(victory, message) {
      isGameOver = true;
      clearInterval(timerInterval);

      const overlay = document.getElementById('game-over-overlay');
      const title = document.getElementById('status-title');
      const desc = document.getElementById('status-desc');

      title.innerText = victory ? "VITTORIA FINALE! 🎃" : "MISSIONE FALLITA 👻";
      title.style.color = victory ? "#ff9d00" : "#ff3300";
      desc.innerText = message;
      overlay.classList.remove('hidden');
    }

    function resetGame() {
      isGameOver = false;
      currentLevel = 1;
      document.getElementById('level-display').innerText = "Livello 1";
      document.getElementById('game-over-overlay').classList.add('hidden');

      // Mostra di nuovo le Zucche e nascondi i Pipistrelli
      pumpkins.forEach(p => { if (p.mesh) p.mesh.visible = true; });
      bats.forEach(b => { if (b.mesh) b.mesh.visible = false; });

      if (player) {
        player.position.set(0, groundY + playerHalfHeight, foregroundZ);
        velocityY = 0;
      }

      timeLeft = 40;
      document.getElementById('timer').innerText = timeLeft;
      startTimer();
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();
      updateEnemies();
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
