<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Walle08 - Platformer 2.5D with 3D Trees</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #87ceeb;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      z-index: 10;
      font-size: 20px;
      font-weight: bold;
    }

    /* Schermata Game Over / Vittoria */
    #game-over-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: white; z-index: 30;
    }
    #game-over-overlay.hidden { display: none; }
    #game-over-overlay h1 { font-size: 42px; margin-bottom: 10px; }
    #game-over-overlay p { font-size: 18px; margin-bottom: 20px; }
    #restart-btn {
      padding: 12px 28px; font-size: 18px; font-weight: bold; color: #fff;
      background: #27ae60; border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.2s;
    }
    #restart-btn:hover { background: #2ecc71; }

    /* CONTROLLI TOUCH */
    #dpad-side {
      position: absolute;
      bottom: 30px;
      left: 20px;
      display: flex;
      gap: 15px;
      z-index: 20;
    }
    .btn-touch {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      color: white;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
    }
    .btn-touch:active, .btn-touch.active {
      background: rgba(46, 204, 113, 0.8);
      border-color: #2ecc71;
      transform: scale(0.95);
    }

    #btn-jump {
      position: absolute;
      bottom: 30px;
      right: 25px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(231, 76, 60, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      touch-action: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
    }
    #btn-jump:active, #btn-jump.active {
      background: rgba(231, 76, 60, 1);
      transform: scale(0.95);
    }
  </style>

  <!-- LIBRERIE THREE.JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="ui-overlay">
    ⏱️ Tempo: <span id="timer">40</span>s
  </div>

  <div id="game-over-overlay" class="hidden">
    <h1 id="status-title">GAME OVER</h1>
    <p id="status-desc">Sei caduto nel vuoto!</p>
    <button id="restart-btn" onclick="resetGame()">Ricomincia</button>
  </div>

  <div id="dpad-side">
    <div class="btn-touch" id="btn-left">◀</div>
    <div class="btn-touch" id="btn-right">▶</div>
  </div>

  <div id="btn-jump">SALTO</div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, player, finishRing;
    let isGameOver = false;

    // Timer del livello
    let timeLeft = 40;
    let timerInterval;

    const touchState = {
      left: false,
      right: false,
      jump: false
    };

    const moveSpeed = 0.16;
    let velocityY = 0;
    const gravity = -0.016;
    const jumpStrength = 0.38;
    let isGrounded = true;
    const groundY = 0.8;
    const foregroundZ = 2.0;

    // Struttura piattaforme e ostacoli fissi
    const platforms = [
      { start: -10, end: 15 },
      { start: 20, end: 40 },
      { start: 47, end: 70 },
      { start: 77, end: 110 }
    ];

    const obstacles = [
      { x: 5, width: 1.2, height: 1.2 },
      { x: 30, width: 1.5, height: 1.5 },
      { x: 58, width: 1.4, height: 1.4 },
      { x: 88, width: 1.6, height: 1.6 }
    ];

    // Sfere di fuoco orizzontali
    const fireballs = [
      { minX: 8, maxX: 14, posY: 1.5, speed: 0.08, dir: 1, radius: 0.6, mesh: null },
      { minX: 22, maxX: 28, posY: 1.5, speed: 0.1, dir: 1, radius: 0.6, mesh: null },
      { minX: 33, maxX: 39, posY: 2.8, speed: 0.09, dir: -1, radius: 0.6, mesh: null },
      { minX: 50, maxX: 56, posY: 1.5, speed: 0.11, dir: 1, radius: 0.6, mesh: null },
      { minX: 61, maxX: 68, posY: 2.6, speed: 0.1, dir: -1, radius: 0.6, mesh: null },
      { minX: 80, maxX: 86, posY: 1.5, speed: 0.12, dir: 1, radius: 0.6, mesh: null }
    ];

    const cameraHeight = 3.5;
    const cameraDistance = 14.0;

    window.onload = () => {
      init();
      animate();
    };

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scena
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, cameraHeight, cameraDistance);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // 4. Luci
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
      mainLight.position.set(10, 20, 15);
      mainLight.castShadow = true;
      scene.add(mainLight);

      // 5. Creazione Percorso e Sfere di Fuoco
      createLevel();
      createFireballs();

      // 6. Personaggio di Fallback Immediato
      createFallbackPlayer();

      // 7. Caricamento walle08.glb e tree.glb
      if (typeof THREE.GLTFLoader !== 'undefined') {
        const loader = new THREE.GLTFLoader();

        // Caricamento Protagonista
        loader.load(
          './walle08.glb',
          (gltf) => {
            if (player) scene.remove(player);

            const loadedModel = gltf.scene;
            const box = new THREE.Box3().setFromObject(loadedModel);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2.2 / (maxDim || 1);
            
            loadedModel.scale.setScalar(scale);
            box.setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            loadedModel.position.sub(center);

            player = new THREE.Group();
            player.add(loadedModel);
            player.position.set(0, groundY, foregroundZ);

            player.traverse((child) => {
              if (child.isMesh) child.castShadow = true;
            });

            scene.add(player);
          },
          undefined,
          (err) => console.warn("Modello walle08.glb non trovato, in uso il segnaposto.", err)
        );

        // Caricamento Alberi 3D (tree.glb) nello Sfondo
        loader.load(
          './tree.glb',
          (gltf) => {
            const baseTree = gltf.scene;
            const box = new THREE.Box3().setFromObject(baseTree);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const baseScale = 3.5 / (maxDim || 1);

            for (let x = -10; x <= 110; x += 7) {
              const isOverHole = !platforms.some(p => x >= p.start && x <= p.end);
              if (isOverHole) continue;

              if (Math.random() > 0.3) {
                const treeClone = baseTree.clone();
                const zPos = -2.0 - Math.random() * 4;
                const randomScale = baseScale * (0.8 + Math.random() * 0.4);

                treeClone.scale.setScalar(randomScale);
                treeClone.position.set(x + (Math.random() - 0.5) * 2, 0, zPos);
                treeClone.rotation.y = Math.random() * Math.PI * 2;

                treeClone.traverse((child) => {
                  if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                  }
                });

                scene.add(treeClone);
              }
            }
          },
          undefined,
          (err) => console.warn("Modello tree.glb non trovato, mantenuta la scena base.", err)
        );
      }

      setupTouchControls();
      startTimer();
      window.addEventListener('resize', onWindowResize);
    }

    function createFallbackPlayer() {
      player = new THREE.Group();
      const geo = new THREE.BoxGeometry(1.2, 1.6, 1.2);
      const mat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      player.add(mesh);
      player.position.set(0, groundY, foregroundZ);
      scene.add(player);
    }

    function createLevel() {
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x47a042 });
      const obstacleMat = new THREE.MeshLambertMaterial({ color: 0x7f8c8d });

      // Piattaforme
      platforms.forEach(p => {
        const length = p.end - p.start;
        const geo = new THREE.BoxGeometry(length, 2, 15);
        const mesh = new THREE.Mesh(geo, groundMat);
        mesh.position.set(p.start + length / 2, -1, 0);
        mesh.receiveShadow = true;
        scene.add(mesh);
      });

      // Ostacoli
      obstacles.forEach(obs => {
        const geo = new THREE.BoxGeometry(obs.width, obs.height, 3);
        const mesh = new THREE.Mesh(geo, obstacleMat);
        mesh.position.set(obs.x, obs.height / 2, foregroundZ);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      });

      // Traguardo a X = 100
      const ringGeo = new THREE.TorusGeometry(2, 0.3, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
      finishRing = new THREE.Mesh(ringGeo, ringMat);
      finishRing.position.set(100, 2.5, foregroundZ);
      scene.add(finishRing);
    }

    function createFireballs() {
      fireballs.forEach(fb => {
        const group = new THREE.Group();

        const geo = new THREE.SphereGeometry(fb.radius, 16, 16);
        const mat = new THREE.MeshBasicMaterial({ color: 0xff4500 });
        const sphere = new THREE.Mesh(geo, mat);
        group.add(sphere);

        const fireLight = new THREE.PointLight(0xff6600, 2, 5);
        group.add(fireLight);

        group.position.set(fb.minX, fb.posY, foregroundZ);
        fb.mesh = group;
        scene.add(fb.mesh);
      });
    }

    function updateFireballs() {
      fireballs.forEach(fb => {
        if (!fb.mesh) return;

        fb.mesh.position.x += fb.speed * fb.dir;

        if (fb.mesh.position.x >= fb.maxX) {
          fb.mesh.position.x = fb.maxX;
          fb.dir = -1;
        } else if (fb.mesh.position.x <= fb.minX) {
          fb.mesh.position.x = fb.minX;
          fb.dir = 1;
        }

        fb.mesh.rotation.z += 0.08;

        if (player && !isGameOver) {
          const dx = player.position.x - fb.mesh.position.x;
          const dy = player.position.y - fb.mesh.position.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < (fb.radius + 0.7)) {
            endGame(false, "Sei stato colpito da una sfera di fuoco!");
          }
        }
      });
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (isGameOver) return;
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;

        if (timeLeft <= 0) {
          endGame(false, "Tempo Scaduto!");
        }
      }, 1000);
    }

    function setupTouchControls() {
      const bindBtn = (id, key) => {
        const btn = document.getElementById(id);
        
        const start = (e) => {
          if (e.cancelable) e.preventDefault();
          touchState[key] = true;
          btn.classList.add('active');
        };

        const end = (e) => {
          if (e.cancelable) e.preventDefault();
          touchState[key] = false;
          btn.classList.remove('active');
        };

        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };

      bindBtn('btn-left', 'left');
      bindBtn('btn-right', 'right');
      bindBtn('btn-jump', 'jump');
    }

    function updatePlayerMovement() {
      if (!player || isGameOver) return;

      let nextX = player.position.x;

      if (touchState.left) {
        nextX -= moveSpeed;
        player.rotation.y = -Math.PI / 2;
      }
      if (touchState.right) {
        nextX += moveSpeed;
        player.rotation.y = Math.PI / 2;
      }

      let canMoveX = true;
      obstacles.forEach(obs => {
        const dist = Math.abs(nextX - obs.x);
        if (dist < (obs.width / 2 + 0.5) && player.position.y < obs.height) {
          canMoveX = false;
        }
      });

      if (canMoveX) {
        player.position.x = nextX;
      }

      player.position.z = foregroundZ;

      if (touchState.jump && isGrounded) {
        velocityY = jumpStrength;
        isGrounded = false;
      }

      player.position.y += velocityY;
      velocityY += gravity;

      const currentX = player.position.x;
      const onPlatform = platforms.some(p => currentX >= p.start && currentX <= p.end);

      if (onPlatform && player.position.y <= groundY) {
        player.position.y = groundY;
        velocityY = 0;
        isGrounded = true;
      }

      if (player.position.y < -6) {
        endGame(false, "Sei caduto nel vuoto!");
      }

      if (currentX >= 98) {
        endGame(true, `Vittoria! Hai completato il percorso con ${timeLeft}s rimasti!`);
      }

      if (finishRing) finishRing.rotation.y += 0.02;

      camera.position.x = player.position.x;
      camera.position.y = cameraHeight;
      camera.position.z = cameraDistance;
      camera.lookAt(player.position.x, cameraHeight - 0.5, foregroundZ);
    }

    function endGame(victory, message) {
      isGameOver = true;
      clearInterval(timerInterval);

      const overlay = document.getElementById('game-over-overlay');
      const title = document.getElementById('status-title');
      const desc = document.getElementById('status-desc');

      title.innerText = victory ? "VITTORIA! 🎉" : "MISSIONE FALLITA 💥";
      title.style.color = victory ? "#2ecc71" : "#e74c3c";
      desc.innerText = message;
      overlay.classList.remove('hidden');
    }

    function resetGame() {
      isGameOver = false;
      timeLeft = 40;
      document.getElementById('timer').innerText = timeLeft;
      document.getElementById('game-over-overlay').classList.add('hidden');

      if (player) {
        player.position.set(0, groundY, foregroundZ);
        velocityY = 0;
      }

      startTimer();
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();
      updateFireballs();
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
