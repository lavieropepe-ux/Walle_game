<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Walle08 - Nature Side Scroller</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #87ceeb;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      z-index: 10;
    }
    #ui-overlay h1 {
      margin: 0;
      font-size: 16px;
      color: #ffffff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    /* CONTROLLI SCORRIMENTO LATERALE */
    #dpad-side {
      position: absolute;
      bottom: 30px;
      left: 20px;
      display: flex;
      gap: 15px;
      z-index: 20;
    }
    .btn-touch {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      color: white;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
    }
    .btn-touch:active, .btn-touch.active {
      background: rgba(46, 204, 113, 0.8);
      border-color: #2ecc71;
      transform: scale(0.95);
    }

    #btn-jump {
      position: absolute;
      bottom: 30px;
      right: 25px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(231, 76, 60, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      touch-action: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
    }
    #btn-jump:active, #btn-jump.active {
      background: rgba(231, 76, 60, 1);
      transform: scale(0.95);
    }
  </style>

  <!-- LIBRERIE THREE.JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <h1>Walle08 - Nature Adventure</h1>
  </div>

  <div id="dpad-side">
    <div class="btn-touch" id="btn-left">◀</div>
    <div class="btn-touch" id="btn-right">▶</div>
  </div>

  <div id="btn-jump">SALTO</div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, player;

    const touchState = {
      left: false,
      right: false,
      jump: false
    };

    const moveSpeed = 0.15;
    let velocityY = 0;
    const gravity = -0.015;
    const jumpStrength = 0.35;
    let isGrounded = true;
    const groundY = 0;
    const foregroundZ = 2.0; // In primo piano davanti agli alberi

    window.onload = () => {
      init();
      animate();
    };

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scena
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      // 2. Telecamera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2.5, 9);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // 4. Luci
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
      mainLight.position.set(10, 20, 15);
      mainLight.castShadow = true;
      scene.add(mainLight);

      // 5. Scenario Naturale (Sfondo Z <= 0)
      createNatureEnvironment();

      // 6. Personaggio di Fallback Immediato (Sempre presente fino a caricamento GLB)
      createFallbackPlayer();

      // 7. Caricamento walle08.glb
      if (typeof THREE.GLTFLoader !== 'undefined') {
        const loader = new THREE.GLTFLoader();
        loader.load(
          './walle08.glb',
          (gltf) => {
            console.log("File walle08.glb caricato con successo!");
            if (player) scene.remove(player);

            const loadedModel = gltf.scene;

            // Calcolo Bounding Box automatico per centrare e ridimensionare
            const box = new THREE.Box3().setFromObject(loadedModel);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2.5 / (maxDim || 1);
            
            loadedModel.scale.setScalar(scale);

            // Centra il punto d'origine al centro del modello
            box.setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            loadedModel.position.sub(center);

            // Gruppo contenitore per la gestione della posizione
            player = new THREE.Group();
            player.add(loadedModel);
            player.position.set(0, groundY + 0.8, foregroundZ);

            player.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
              }
            });

            scene.add(player);
          },
          undefined,
          (err) => {
            console.error("ERRORE CARICAMENTO walle08.glb: Verificare che il file sia presente nella repository GitHub con il nome esatto in minuscolo.", err);
          }
        );
      }

      setupTouchControls();
      window.addEventListener('resize', onWindowResize);
    }

    function createFallbackPlayer() {
      player = new THREE.Group();
      const geo = new THREE.BoxGeometry(1.2, 1.6, 1.2);
      const mat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      player.add(mesh);
      player.position.set(0, groundY + 0.8, foregroundZ);
      scene.add(player);
    }

    function createNatureEnvironment() {
      // Terreno
      const groundGeo = new THREE.BoxGeometry(300, 2, 15);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x47a042 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.position.set(0, -1, 0);
      ground.receiveShadow = true;
      scene.add(ground);

      const treeMatTrunk = new THREE.MeshLambertMaterial({ color: 0x5a3d28 });
      const treeMatLeaves = new THREE.MeshLambertMaterial({ color: 0x2d7d32 });
      const bushMat = new THREE.MeshLambertMaterial({ color: 0x388e3c });

      // Alberi e Cespugli sullo sfondo
      for (let x = -100; x <= 100; x += 6) {
        if (Math.random() > 0.25) {
          const zPos = -1.5 - Math.random() * 4; 
          const scale = 1.0 + Math.random() * 0.5;

          const trunkGeo = new THREE.CylinderGeometry(0.25 * scale, 0.35 * scale, 3 * scale, 8);
          const trunk = new THREE.Mesh(trunkGeo, treeMatTrunk);
          trunk.position.set(x + (Math.random() - 0.5) * 2, (3 * scale) / 2, zPos);
          trunk.castShadow = true;
          scene.add(trunk);

          const leavesGeo = new THREE.ConeGeometry(1.8 * scale, 4 * scale, 8);
          const leaves = new THREE.Mesh(leavesGeo, treeMatLeaves);
          leaves.position.set(trunk.position.x, trunk.position.y + (1.8 * scale), zPos);
          leaves.castShadow = true;
          scene.add(leaves);
        }

        if (Math.random() > 0.35) {
          const zPos = -1.0 - Math.random() * 2;
          const bushGeo = new THREE.SphereGeometry(0.6 + Math.random() * 0.3, 8, 8);
          const bush = new THREE.Mesh(bushGeo, bushMat);
          bush.position.set(x + (Math.random() - 0.5) * 3, 0.4, zPos);
          bush.castShadow = true;
          scene.add(bush);
        }
      }
    }

    function setupTouchControls() {
      const bindBtn = (id, key) => {
        const btn = document.getElementById(id);
        
        const start = (e) => {
          if (e.cancelable) e.preventDefault();
          touchState[key] = true;
          btn.classList.add('active');
        };

        const end = (e) => {
          if (e.cancelable) e.preventDefault();
          touchState[key] = false;
          btn.classList.remove('active');
        };

        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };

      bindBtn('btn-left', 'left');
      bindBtn('btn-right', 'right');
      bindBtn('btn-jump', 'jump');
    }

    function updatePlayerMovement() {
      if (!player) return;

      if (touchState.left) {
        player.position.x -= moveSpeed;
        player.rotation.y = -Math.PI / 2;
      }
      if (touchState.right) {
        player.position.x += moveSpeed;
        player.rotation.y = Math.PI / 2;
      }

      player.position.z = foregroundZ;

      if (touchState.jump && isGrounded) {
        velocityY = jumpStrength;
        isGrounded = false;
      }

      player.position.y += velocityY;
      velocityY += gravity;

      if (player.position.y <= groundY + 0.8) {
        player.position.y = groundY + 0.8;
        velocityY = 0;
        isGrounded = true;
      }

      // La telecamera insegue il personaggio
      camera.position.x = player.position.x;
      camera.position.z = foregroundZ + 7;
      camera.lookAt(player.position.x, player.position.y, foregroundZ);
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
