<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Walle08 - Side Scroller</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a24;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      z-index: 10;
    }
    #ui-overlay h1 {
      margin: 0;
      font-size: 16px;
      color: #00d2ff;
    }

    /* CONTROLLI SCORRIMENTO LATERALE */
    #dpad-side {
      position: absolute;
      bottom: 30px;
      left: 20px;
      display: flex;
      gap: 15px;
      z-index: 20;
    }
    .btn-touch {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      color: white;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .btn-touch:active, .btn-touch.active {
      background: rgba(0, 210, 255, 0.7);
      border-color: #00d2ff;
      transform: scale(0.95);
    }

    #btn-jump {
      position: absolute;
      bottom: 30px;
      right: 25px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(231, 76, 60, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      touch-action: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    #btn-jump:active, #btn-jump.active {
      background: rgba(231, 76, 60, 1);
      transform: scale(0.95);
    }
  </style>

  <!-- LIBRERIE TRADIZIONALI PER LA MASSIMA COMPATIBILITÀ MOBILE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <h1>Walle08 - Side Scroller</h1>
  </div>

  <!-- Pulsanti di movimento laterale (Sinistra / Destra) -->
  <div id="dpad-side">
    <div class="btn-touch" id="btn-left">◀</div>
    <div class="btn-touch" id="btn-right">▶</div>
  </div>

  <!-- Pulsante Salto -->
  <div id="btn-jump">SALTO</div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, player;

    const touchState = {
      left: false,
      right: false,
      jump: false
    };

    // Parametri di movimento e fisica
    const moveSpeed = 0.15;
    let velocityY = 0;
    const gravity = -0.015;
    const jumpStrength = 0.35;
    let isGrounded = true;
    const groundY = 0;

    window.onload = () => {
      init();
      animate();
    };

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scena
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a24);

      // 2. Telecamera impostata di profilo (Scorrimento Laterale)
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3, 12); // Posizionata di fronte rispetto all'asse Z

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // 4. Illuminazione
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
      mainLight.position.set(5, 15, 10);
      mainLight.castShadow = true;
      scene.add(mainLight);

      // 5. Piattaforma/Terreno per lo scorrimento
      createPlatform();

      // 6. Personaggio di partenza immediato
      createFallbackPlayer();

      // 7. Caricamento del modello walle08.glb
      if (typeof THREE.GLTFLoader !== 'undefined') {
        const loader = new THREE.GLTFLoader();
        loader.load(
          './walle08.glb',
          (gltf) => {
            if (player) scene.remove(player);

            player = gltf.scene;

            const box = new THREE.Box3().setFromObject(player);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2 / (maxDim || 1);
            player.scale.setScalar(scale);

            box.setFromObject(player);
            const center = box.getCenter(new THREE.Vector3());
            player.position.sub(center);
            player.position.y = groundY;

            player.traverse((child) => {
              if (child.isMesh) child.castShadow = true;
            });

            scene.add(player);
          },
          undefined,
          (err) => console.warn("File walle08.glb non trovato, in uso il segnaposto.", err)
        );
      }

      setupTouchControls();
      window.addEventListener('resize', onWindowResize);
    }

    function createFallbackPlayer() {
      const geo = new THREE.BoxGeometry(1, 1.5, 1);
      const mat = new THREE.MeshLambertMaterial({ color: 0x00d2ff });
      player = new THREE.Mesh(geo, mat);
      player.position.set(0, 0.75, 0);
      player.castShadow = true;
      scene.add(player);
    }

    function createPlatform() {
      // Piattaforma orizzontale su cui camminare
      const geo = new THREE.BoxGeometry(200, 1, 4);
      const mat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
      const platform = new THREE.Mesh(geo, mat);
      platform.position.set(0, -0.5, 0);
      platform.receiveShadow = true;
      scene.add(platform);

      // Griglia decorativa sul percorso
      const grid = new THREE.GridHelper(200, 50, 0x00d2ff, 0x444444);
      grid.position.y = 0.01;
      scene.add(grid);
    }

    function setupTouchControls() {
      const bindBtn = (id, key) => {
        const btn = document.getElementById(id);
        
        const start = (e) => {
          if (e.cancelable) e.preventDefault();
          touchState[key] = true;
          btn.classList.add('active');
        };

        const end = (e) => {
          if (e.cancelable) e.preventDefault();
          touchState[key] = false;
          btn.classList.remove('active');
        };

        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };

      bindBtn('btn-left', 'left');
      bindBtn('btn-right', 'right');
      bindBtn('btn-jump', 'jump');
    }

    function updatePlayerMovement() {
      if (!player) return;

      // Movimento orizzontale lungo l'asse X
      if (touchState.left) {
        player.position.x -= moveSpeed;
        player.rotation.y = -Math.PI / 2; // Ruota verso sinistra
      }
      if (touchState.right) {
        player.position.x += moveSpeed;
        player.rotation.y = Math.PI / 2; // Ruota verso destra
      }

      // Gestione Salto e Gravità
      if (touchState.jump && isGrounded) {
        velocityY = jumpStrength;
        isGrounded = false;
      }

      player.position.y += velocityY;
      velocityY += gravity;

      // Collisione con il pavimento
      if (player.position.y <= groundY) {
        player.position.y = groundY;
        velocityY = 0;
        isGrounded = true;
      }

      // La telecamera segue il movimento del personaggio lungo l'asse X
      camera.position.x = player.position.x;
      camera.lookAt(player.position.x, player.position.y + 1, 0);
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
